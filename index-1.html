<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MINE</title>
<meta name="theme-color" content="#0d1220">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
<header>
<img id="face" alt="MINE">
<div><h1>MINE</h1><p id="status">Your AI companion</p></div>
<button id="gear" type="button">Settings</button><button id="clear" type="button">Clear</button>
</header>
<div id="set" hidden><label>API key (stays on this phone)<input id="k" type="password" autocomplete="off"></label><label>Model name<input id="mdl"></label><button id="sv" type="button">Save</button></div>
<div id="log" aria-live="polite"></div>
<form id="f"><textarea id="t" rows="1" placeholder="Say something to MINE…"></textarea><button id="send" type="submit">Send</button></form>
</div>
<script src="faces.js"></script>
<script src="script.js"></script>
</body>
</html>
