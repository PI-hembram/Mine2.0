<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MINE</title>
<meta name="theme-color" content="#0d1220">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>
<div id="app">
<header>
<button id="menu" type="button" aria-label="Chats">☰</button>
<img id="face" alt="MINE">
<div><h1>MINE</h1><p id="status">Your AI companion</p></div>
<button id="mbtn" type="button" aria-label="Memory">🧠</button><button id="sbtn" type="button" aria-label="Study">📚</button><button id="wbtn" type="button" aria-label="Well-being">📊</button><button id="gear" type="button">Settings</button><button id="clear" type="button">Clear</button>
</header>
<div id="set" hidden>
<label>API key (stays on this phone)<input id="k" type="password" autocomplete="off"></label>
<label>Model name<input id="mdl"></label>
<label>What should MINE call you?<input id="un" placeholder="Master"></label>
<label>Personality (how MINE acts)<textarea id="pp"></textarea></label>
<div class="row"><button id="sv" type="button">Save</button><button id="rp" type="button">Reset personality</button><button id="nt" type="button">Enable notifications</button><button id="ex" type="button">Export chats</button><button id="im" type="button">Import chats</button></div>
<input id="imp" type="file" accept="application/json" hidden>
</div>
<div id="wb" hidden>
<div class="row"><select id="wd"><option value="0">Today</option><option value="1">Yesterday</option><option value="2">2 days ago</option></select><input id="wh" type="number" min="0" max="24" placeholder="hours"><input id="wm" type="number" min="0" max="59" placeholder="min"></div>
<label>Top apps (e.g. Instagram 1h20m, YouTube 45m)<textarea id="wa"></textarea></label>
<div class="row"><button id="ws" type="button">Save day</button><button id="wsh" type="button">📸 Read screenshot</button><button id="wq" type="button">Ask MINE</button></div>
<input id="wf" type="file" accept="image/*" hidden>
<div id="wsum"></div>
</div>
<div id="mp" hidden>
<div class="lab">What MINE remembers about you (auto-saved from chats; delete anything)</div>
<div id="ml"></div>
<div class="row"><input id="mt" placeholder="Add something to remember…"><button id="madd" type="button">Add</button><button id="mclr" type="button">Clear all</button></div>
</div>
<div id="log" aria-live="polite"></div>
<div id="pv" hidden></div>
<form id="f"><button id="att" type="button" aria-label="Attach image">📎</button><input id="img" type="file" accept="image/*" hidden><textarea id="t" rows="1" placeholder="Say something to MINE…"></textarea><button id="send" type="submit">Send</button></form>
</div>
<div id="dim" hidden></div>
<div id="sp" hidden>
<div class="sh"><b>Study</b><span><button id="stq" type="button" class="on">Quiz</button> <button id="stp" type="button">Progress</button> <button id="sx" type="button" aria-label="Close">✕</button></span></div>
<div id="sq">
<div class="row"><select id="sc"><option>6</option><option>7</option><option>8</option><option>9</option><option selected>10</option><option>11</option><option>12</option></select><select id="ss"></select></div>
<div class="row"><input id="sch" placeholder="Chapter (blank = whole syllabus)"><button id="chb" type="button">Load chapters</button></div>
<select id="chs" hidden></select>
<div class="row"><select id="sn"><option>5</option><option selected>10</option><option>15</option></select><select id="sd"><option>Mixed</option><option>Easy</option><option>Hard</option></select></div>
<div class="row"><button id="go" type="button" class="pri">Start quiz</button><button id="gw" type="button">Practice my mistakes</button></div>
<div id="sm" class="ex"></div>
</div>
<div id="sg" hidden></div>
<div id="spg" hidden></div>
</div>
<aside id="drawer" hidden>
<h2>MINE</h2>
<button id="newc" type="button">+ New chat</button>
<input id="q" type="search" placeholder="Search chats…" autocomplete="off">
<div id="list"></div>
</aside>
<script src="faces.js"></script>
<script src="script.js?v=5"></script>
</body>
</html>
