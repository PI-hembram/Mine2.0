<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MINE</title>
<meta name="theme-color" content="#0d1220">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>
<div id="app">
<header>
<button id="menu" type="button" aria-label="Chats">☰</button>
<img id="face" alt="MINE">
<div><h1>MINE</h1><p id="status">Your AI companion</p></div>
<button id="gear" type="button">Settings</button><button id="clear" type="button">Clear</button>
</header>
<div id="set" hidden>
<label>API key (stays on this phone)<input id="k" type="password" autocomplete="off"></label>
<label>Model name<input id="mdl"></label>
<label>What should MINE call you?<input id="un" placeholder="Master"></label>
<label>Personality (how MINE acts)<textarea id="pp"></textarea></label>
<div class="row"><button id="sv" type="button">Save</button><button id="rp" type="button">Reset personality</button></div>
</div>
<div id="log" aria-live="polite"></div>
<form id="f"><textarea id="t" rows="1" placeholder="Say something to MINE…"></textarea><button id="send" type="submit">Send</button></form>
</div>
<div id="dim" hidden></div>
<aside id="drawer" hidden>
<h2>MINE</h2>
<button id="newc" type="button">+ New chat</button>
<input id="q" type="search" placeholder="Search chats…" autocomplete="off">
<div id="list"></div>
</aside>
<script src="faces.js"></script>
<script src="script.js?v=2"></script>
</body>
</html>
